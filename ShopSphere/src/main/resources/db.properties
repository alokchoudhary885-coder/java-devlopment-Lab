# ==============================================================================
# ShopSphere Database Configuration
# ==============================================================================

# JDBC Connection Settings
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/shopsphere?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
db.username=root
db.password=

# Connection Pool / Optimization Settings
db.initialSize=5
db.maxTotal=20
db.maxIdle=10
db.minIdle=2
db.maxWaitMillis=10000

# Mock fallback for test environments where MySQL service is not yet started
db.mockFallbackEnabled=true
